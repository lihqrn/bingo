<!-- Modal de Histórico de Rodadas Anteriores -->
<div class="modal fade" id="historyModal" tabindex="-1" aria-labelledby="historyModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable">
        <div class="modal-content bg-card border border-secondary-subtle shadow-lg">
            <div class="modal-header border-secondary-subtle">
                <div class="d-flex align-items-center gap-2">
                    <i class="bi bi-clock-history text-info fs-4"></i>
                    <div>
                        <h5 class="modal-title mb-0" id="historyModalLabel">Histórico de Rodadas</h5>
                        <small class="text-secondary">Armazenado no LocalStorage do seu navegador</small>
                    </div>
                </div>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>
            <div class="modal-body p-3 p-md-4">
                <!-- Actions Bar inside Modal -->
                <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3 pb-3 border-bottom border-secondary-subtle">
                    <div class="fs-sm text-secondary">
                        Total de rodadas registradas: <strong class="text-white" id="modal-history-total">0</strong>
                    </div>
                    <div class="d-flex gap-2">
                        <button class="btn btn-sm btn-outline-info d-flex align-items-center gap-1" id="btn-export-history" onclick="window.BingoApp.exportHistory()">
                            <i class="bi bi-download"></i> Exportar (JSON)
                        </button>
                        <button class="btn btn-sm btn-outline-danger d-flex align-items-center gap-1" id="btn-clear-history" onclick="window.BingoApp.clearHistoryPrompt()">
                            <i class="bi bi-trash3"></i> Limpar Tudo
                        </button>
                    </div>
                </div>

                <!-- History Rounds Container -->
                <div id="history-rounds-list" class="d-flex flex-column gap-3">
                    <!-- Populated dynamically via JS -->
                    <div class="text-center py-5 text-secondary" id="history-empty-state">
                        <i class="bi bi-journal-x fs-1 opacity-50 mb-2 d-block"></i>
                        <p class="mb-0">Nenhuma rodada anterior registrada ainda.</p>
                        <small>Ao finalizar uma partida ou gritar Bingo, a rodada será salva aqui automaticamente!</small>
                    </div>
                </div>
            </div>
            <div class="modal-footer border-secondary-subtle">
                <button type="button" class="btn btn-secondary px-4" data-bs-dismiss="modal">Fechar</button>
            </div>
        </div>
    </div>
</div>
